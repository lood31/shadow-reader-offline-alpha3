name: iOS macOS build and tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - 'third_party/whisper.cpp-1.9.4/**'
      - 'third_party/espeak-ng-1.52.0/**'
      - '.github/workflows/ios-macos.yml'

permissions:
  contents: read

concurrency:
  group: ios-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download verified model bundle from this repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          mkdir -p ios/.build/ci
          read -r tag asset < <(python3 -c 'import json; d=json.load(open("ios/Resources/ci-resource-bundle.json")); print(d["releaseTag"],d["assetName"])')
          gh release download "$tag" --pattern "$asset" --dir ios/.build/ci
          python3 ios/scripts/ci_resources.py restore "ios/.build/ci/$asset"
      - name: Build native libraries, unsigned iOS app, and run XCTest
        shell: bash
        run: bash ios/scripts/ci_build.sh 2>&1 | tee ios/.build/ci/pipeline.log
      - name: Upload build logs and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-results-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ios/.build/ci/*.log
            ios/.build/ci/*.xcresult
            ios/.build/ci/Podfile.lock
            ios/ShadowReader.xcworkspace/xcshareddata/swiftpm/Package.resolved
